    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Incremental Alchemist</title>
        <link href="https://fonts.cdnfonts.com/css/minecraft-3" rel="stylesheet">
    </head>
    <body onload="startUp()"> <!-- default to generators tab on load -->  

        <nav> <!-- Side menu buttons, need to apply css and js still -->
            <button id="generatorsTab" onclick="switchTab('generators')"> Generators </button>
            <button id="upgradesTab" onclick="switchTab('upgrades')"> Upgrades </button>
            <button id="prestigeTab" onclick="switchTab('prestige')"> Prestige </button>
            <button id="achievementsTab" onclick="switchTab('achievements')"> Achievements </button>
            <button id="statisticsTab" onclick="switchTab('statistics')"> Statistics </button>
            <button id="wellnessTab" onclick="switchTab('wellness')"> Wellness </button>
        </nav>

        <main>
                <section id="generatorsSection" class="tabSection"> <!-- the actual page for gens (kinda main page) -->
                    <h2>Generators</h2>
                    
                    <!-- gold information -->
                        <div id="goldInfoGenerators"> 
                            <p id="goldDisplayGenerators">Gold: 0</p>
                            <p id="gpsDisplayGenerators">Gold per second: 0</p>
                            <button onclick="saveGame(); alert('Game saved!')">Save Game</button>
                        </div>
                        
                        <div id="generatorsContainer"> <!-- generators are created here from js -->
                    </div>
                </section>

                <section id="upgradesSection" class="tabSection" > <!-- page for the upgrades -->
                    <h2>Upgrades</h2>
                    <!-- gold information -->
                        <div id="goldInfoUpgrades"> 
                            <p id="goldDisplayUpgrades">Gold: 0</p>
                            <p id="gpsDisplayUpgrades">Gold per second: 0</p>
                            <button onclick="saveGame(); alert('Game saved!')">Save Game</button>
                        </div>
                    <div id="upgradesContainer"></div> <!-- upgrades are created here from js-->
                </section>

                <section id="prestigeSection" class="tabSection"> <!-- page for prestiging -->
                    <h2>Prestige</h2>
                    <!-- gold information -->
                        <div id="goldInfoPrestige"> 
                            <p id="goldDisplayPrestige">Gold: 0</p>
                            <p id="gpsDisplayGenerators">Gold per second: 0</p>
                            <button onclick="saveGame(); alert('Game saved!')">Save Game</button>
                        </div>
                </section>

                <section id="achievementsSection" class="tabSection"> <!-- achievement page -->
                    <h2>Achievements</h2>
                    
                </section>

                <section id="statisticsSection" class="tabSection"> <!-- page for stats -->
                    <h2>Statistics</h2>
                    
                </section>

                <section id="wellnessSection" class="tabSection"> <!-- page for my wellness reminder thingy -->
                    <h2>Wellness</h2>
                    
                </section>
                
        </main>
        <script src="game.js" ></script>
    </body>
    </html>
